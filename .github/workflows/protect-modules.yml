name: APK加固-模块勾选

# 勾选式统一入口：想加固哪些模块就勾选哪些，执行顺序由 protect.sh 固定为
#   签名校验 → Dex2C → 基础加壳（加壳必须最后，加了壳其它模块改不动）
# 旧 workflow（签名校验/签名校验-单独/dex2c/APK加固）已移除，本入口为唯一入口。

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK下载链接(需已用开发者keystore签名)'
        required: true
      sigcheck:
        description: '勾选: 签名校验'
        type: boolean
        default: true
      dex2c:
        description: '勾选: Dex2C 转译(需提供类规则)'
        type: boolean
        default: false
      dex2c_rules:
        description: 'Dex2C 类名规则(每行一条,支持 com.test.** / activity*)'
        required: false
        default: ''
      packer:
        description: '勾选: 基础加壳(尚未接入)'
        type: boolean
        default: false

jobs:
  protect:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android NDK（优先预装，零下载）
        id: ndk
        uses: ./.github/actions/setup-ndk
        with:
          ndk-version: r26d

      - name: 解压 dcc 分发包
        run: |
          mkdir -p build   # unzip 的 checkdir 不会自建多级父目录,build/ 不在仓库里必须先建(报错十五)
          unzip -qo tools/dcc.zip -d build/dcc
          test -f build/dcc/dcc/dcc.py || { echo "❌ dcc.zip 解压产物异常"; exit 1; }

      - name: 安装 python 依赖(dcc)
        run: pip3 install -r build/dcc/dcc/requirements.txt

      - name: 勾选前置校验
        run: |
          ok=1
          if [[ "${{ inputs.dex2c }}" == "true" && -z "${{ inputs.dex2c_rules }}" ]]; then
            echo "❌ 勾选了 Dex2C 但未提供类名规则(dex2c_rules)"
            ok=0
          fi
          if [[ "${{ inputs.sigcheck }}" != "true" && "${{ inputs.dex2c }}" != "true" && "${{ inputs.packer }}" != "true" ]]; then
            echo "❌ 至少勾选一个模块"
            ok=0
          fi
          [[ $ok -eq 1 ]] || exit 1

      - name: 下载 APK
        timeout-minutes: 5
        run: |
          set -o pipefail
          curl -fL --retry 3 -o app.apk "${{ inputs.apk_url }}" 2>&1 | tee -a build.log
          ls -la app.apk | tee -a build.log

      - name: 生成 Dex2C 规则文件
        if: ${{ inputs.dex2c }}
        run: |
          printf '%s\n' "${{ inputs.dex2c_rules }}" > dex2c_rules.txt
          cat dex2c_rules.txt | tee -a build.log

      - name: 执行模块编排（固定顺序-签名校验-Dex2C-加壳）
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/pipelines/protect.sh
          ARGS=""
          if [[ "${{ inputs.sigcheck }}" == "true" ]]; then ARGS="$ARGS --sigcheck"; fi
          if [[ "${{ inputs.dex2c }}" == "true" ]]; then ARGS="$ARGS --dex2c dex2c_rules.txt"; fi
          if [[ "${{ inputs.packer }}" == "true" ]]; then ARGS="$ARGS --packer"; fi
          set -o pipefail
          ./scripts/pipelines/protect.sh app.apk protected_unsigned.apk $ARGS 2>&1 | tee -a build.log

      - name: 上传加固包到 R2
        id: upload-r2
        run: |
          set -o pipefail
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "❌ R2_ENDPOINT/R2_BUCKET 为空，检查仓库 Secrets" | tee -a build.log
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_KEY"
          export AWS_DEFAULT_REGION="auto"
          SAFE_NAME="${GITHUB_RUN_ID}_模块勾选包.apk"
          aws s3 cp protected_unsigned.apk "s3://$R2_BUCKET/apks/$SAFE_NAME" \
            --endpoint-url "$R2_ENDPOINT" --no-progress 2>&1 | tee -a build.log
          DL="$R2_PUBLIC_DOMAIN/apks/$SAFE_NAME"
          echo "download_url=$DL" >> "$GITHUB_OUTPUT"
          echo "🔗 下载地址: $DL" | tee -a build.log

      - name: 显示下载链接
        run: |
          echo "::notice title=📥 模块勾选加固包(未签名,请自行重签)::${{ steps.upload-r2.outputs.download_url }}"

      - name: 上传构建日志（无论成败都可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志-build.log
          path: build.log
          if-no-files-found: warn

      - name: Artifact 备用
        uses: actions/upload-artifact@v4
        with:
          name: 模块勾选加固包-未签名
          path: protected_unsigned.apk
          if-no-files-found: error
