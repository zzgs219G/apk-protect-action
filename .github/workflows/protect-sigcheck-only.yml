name: 签名校验-单独

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK下载链接(需已用开发者keystore签名)'
        required: true

# 模块化说明:本 workflow 只注入签名校验(不跑 dex2c),
# 用于单独测试/定位签名校验模块。与"签名校验"(联合方案)、"dex2c" 并列,
# 是未来卡片式功能勾选的独立模块入口之一。

jobs:
  inject:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: 安装 python 依赖(dcc)
        # 报错六:dcc 内置 androguard 的 AXMLPrinter 依赖 lxml,runner 系统
        # python 没有它 → LAUNCHER 解析降级文本正则 → 二进制 manifest 必失败。
        # 与 protect-sigcheck.yml / protect-dcc.yml 保持一致,统一装 requirements.txt。
        run: pip3 install -r sigcheck/dex2c/dcc/requirements.txt

      - name: 下载 APK
        timeout-minutes: 5
        run: |
          set -o pipefail
          curl -fL --retry 3 -o app.apk "${{ github.event.inputs.apk_url }}" 2>&1 | tee -a build.log
          ls -la app.apk | tee -a build.log

      - name: 执行单独签名校验注入
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/pipelines/protect-sigcheck-only.sh scripts/sig-hash/make-sig-hash.sh
          set -o pipefail
          ./scripts/pipelines/protect-sigcheck-only.sh app.apk protected_unsigned.apk 2>&1 | tee -a build.log

      - name: 上传加固包到 R2
        id: upload-r2
        run: |
          set -o pipefail
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "❌ R2_ENDPOINT/R2_BUCKET 为空，检查仓库 Secrets" | tee -a build.log
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_KEY"
          export AWS_DEFAULT_REGION="auto"
          SAFE_NAME="${GITHUB_RUN_ID}_单独签名校验包.apk"
          aws s3 cp protected_unsigned.apk "s3://$R2_BUCKET/apks/$SAFE_NAME" \
            --endpoint-url "$R2_ENDPOINT" --no-progress 2>&1 | tee -a build.log
          DL="$R2_PUBLIC_DOMAIN/apks/$SAFE_NAME"
          echo "download_url=$DL" >> "$GITHUB_OUTPUT"
          echo "🔗 下载地址: $DL" | tee -a build.log

      - name: 显示下载链接
        run: |
          echo "::notice title=📥 单独签名校验包(未签名,请自行重签)::${{ steps.upload-r2.outputs.download_url }}"

      - name: 上传构建日志（无论成败都可下载）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志-build.log
          path: build.log
          if-no-files-found: warn

      - name: Artifact 备用
        uses: actions/upload-artifact@v4
        with:
          name: 单独签名校验包-未签名
          path: protected_unsigned.apk
          if-no-files-found: error
