name: 模块护栏(module-guard)

# 强制执行 AGENTS.md 的冻结模块契约:
# 冻结模块被改坏 → 回归测试红 → CI 失败,拦截合入。
# 本 workflow 只跑宿主端测试,不需要 NDK/签名工具,秒级完成。

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行冻结模块回归测试
        run: bash tests/run-tests.sh
