name: APK加固

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK下载链接'
        required: true

jobs:
  protect:
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
    env:
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 缓存 dpt-shell
        id: cache-dpt
        uses: actions/cache@v4
        with:
          path: dpt-shell/
          key: dpt-shell-${{ hashFiles('tools/dpt-shell-v2.19.0.zip') }}

      - name: 解压 dpt-shell
        if: steps.cache-dpt.outputs.cache-hit != 'true'
        run: unzip tools/dpt-shell-v2.19.0.zip -d dpt-shell

      - name: 下载 APK
        run: wget -v -O app.apk ${{ github.event.inputs.apk_url }}

      - name: 执行加固
        run: java -jar dpt-shell/executable/dpt.jar -f app.apk

      - name: 安装 AWS CLI
        run: pip install awscli --upgrade

      - name: 检查R2密钥
        run: |
          echo "R2_ACCESS_KEY 长度: ${#R2_ACCESS_KEY}"
          echo "R2_SECRET_KEY 长度: ${#R2_SECRET_KEY}"
          echo "R2_ENDPOINT 长度: ${#R2_ENDPOINT}"
          echo "R2_BUCKET 长度: ${#R2_BUCKET}"
          echo "R2_PUBLIC_DOMAIN 长度: ${#R2_PUBLIC_DOMAIN}"

      - name: 上传加固包到 R2
        id: upload-r2
        run: |
          # 检查必要变量是否为空
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "❌ R2_ENDPOINT/R2_BUCKET 变量为空，请检查仓库Secrets配置"
            exit 1
          fi

          # 直接通过环境变量传递密钥，避免 aws configure 不生效
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_KEY"
          export AWS_DEFAULT_REGION="auto"

          # 文件名只用 run_id，不加时间戳，方便 APP 端直接拼接
          SAFE_NAME="${GITHUB_RUN_ID}_加固包.apk"
          echo "📦 文件名: $SAFE_NAME"

          aws s3 cp app_signed.apk s3://$R2_BUCKET/apks/$SAFE_NAME \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress

          DOWNLOAD_URL="$R2_PUBLIC_DOMAIN/apks/$SAFE_NAME"
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "🔗 下载地址: $DOWNLOAD_URL"

      - name: 显示下载链接
        run: |
          DOWNLOAD_URL="${{ steps.upload-r2.outputs.download_url }}"
          echo "========================================"
          echo "✅ 加固完成！下载地址："
          echo "$DOWNLOAD_URL"
          echo "========================================"
          echo "::notice title=📥 点击下载加固包::$DOWNLOAD_URL"

      - name: 上传加固包（Artifact 备用）
        uses: actions/upload-artifact@v4
        with:
          name: 加固后的APK
          path: app_signed.apk
          if-no-files-found: error
