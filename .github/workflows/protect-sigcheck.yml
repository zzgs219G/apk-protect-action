name: APK签名校验注入(sigcheck)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK下载链接(需已用开发者keystore签名)'
        required: true

jobs:
  inject:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: 安装 python 依赖(dcc)
        run: pip3 install -r sigcheck/dex2c/dcc/requirements.txt

      - name: 下载 APK
        timeout-minutes: 5
        run: |
          curl -fL --retry 3 -o app.apk "${{ github.event.inputs.apk_url }}"
          ls -la app.apk

      - name: 执行 sigcheck 注入
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x scripts/sigcheck_inject.sh scripts/gen_sig_hash.sh
          ./scripts/sigcheck_inject.sh app.apk protected_unsigned.apk

      - name: 上传加固包到 R2
        id: upload-r2
        run: |
          if [[ -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "❌ R2_ENDPOINT/R2_BUCKET 为空，检查仓库 Secrets"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_KEY"
          export AWS_DEFAULT_REGION="auto"
          SAFE_NAME="${GITHUB_RUN_ID}_sigcheck包.apk"
          aws s3 cp protected_unsigned.apk "s3://$R2_BUCKET/apks/$SAFE_NAME" \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          DL="$R2_PUBLIC_DOMAIN/apks/$SAFE_NAME"
          echo "download_url=$DL" >> "$GITHUB_OUTPUT"
          echo "🔗 下载地址: $DL"

      - name: 显示下载链接
        run: |
          echo "::notice title=📥 sigcheck加固包(未签名,请自行重签)::${{ steps.upload-r2.outputs.download_url }}"

      - name: Artifact 备用
        uses: actions/upload-artifact@v4
        with:
          name: sigcheck加固包-未签名
          path: protected_unsigned.apk
          if-no-files-found: error
